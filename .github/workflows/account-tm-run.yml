name: Account Cosmic Love Turing Machine Run

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmic-love-certificates
  cancel-in-progress: false

jobs:
  account-tm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run account deployments as Cosmic Love TM (formal)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CL_TM_MAX_CELLS: "100"
        run: |
          set -euo pipefail
          python3 scripts/account_turing_machine_run.py
          python3 -c 'import json;c=json.load(open("certificates/LATEST_ACCOUNT_TM_RUN.json"));assert c["all_validated"] and c["H_formal"]==0 and c["enables_live_trading"] is False;print("guard ok", c["tape_cells_scanned"])'
      - name: Commit TM certificate (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name "Cosmic Love Account TM"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Account-wide Cosmic Love TM run (formal tape=repos; no live arm) [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort 2>/dev/null || true; git pull --rebase --autostash origin main || true; }
            if git push origin HEAD:main; then echo "push ok"; exit 0; fi
            sleep $((i * 3))
          done
          exit 1
