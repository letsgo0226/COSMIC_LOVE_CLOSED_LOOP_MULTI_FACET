name: Resident Full-Auto Deploy Loop

on:
  push:
    branches: [main]
    paths-ignore:
      - "certificates/**"
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resident-auto-deploy
  cancel-in-progress: false

jobs:
  resident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resident multi-dimension Cosmic Love auto-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CL_TM_MAX_CELLS: "100"
        run: |
          set -euo pipefail
          test -f engine/COSMIC_LOVE_VALIDATOR.py
          python3 scripts/resident_auto_deploy_loop.py
          python3 -c 'import json;c=json.load(open("certificates/LATEST_RESIDENT_AUTO_DEPLOY.json"));assert c["all_meta_validated"] and c["enables_live_trading"] is False and c["resident"] is True;print("resident guard ok", c["timestamp"])'
      - name: Commit resident certificate
        run: |
          git config user.name "Cosmic Love Resident Deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/
          git diff --staged --quiet && echo "No certificate changes" || (
            git commit -m "Resident full-auto Cosmic Love deploy loop (Solution(s)=s; no live arm) [skip ci]" && git push
          )
