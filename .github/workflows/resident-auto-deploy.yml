name: Resident Full-Auto Deploy Loop

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmic-love-certificates
  cancel-in-progress: false

jobs:
  resident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resident multi-dimension Cosmic Love auto-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CL_TM_MAX_CELLS: "100"
        run: |
          set -euo pipefail
          test -f engine/COSMIC_LOVE_VALIDATOR.py
          python3 scripts/resident_auto_deploy_loop.py
          python3 -c 'import json;c=json.load(open("certificates/LATEST_RESIDENT_AUTO_DEPLOY.json"));assert c["all_meta_validated"] and c["enables_live_trading"] is False and c["resident"] is True;print("resident guard ok", c["timestamp"])'
      - name: Commit resident certificate (rebase-safe push)
        run: |
          set -euo pipefail
          git config user.name "Cosmic Love Resident Deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/
          if git diff --staged --quiet; then
            echo "No certificate changes"
            exit 0
          fi
          git commit -m "Resident full-auto Cosmic Love deploy loop (Solution(s)=s; no live arm) [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort 2>/dev/null || true; git pull --rebase --autostash origin main || true; }
            if git push origin HEAD:main; then
              echo "push ok attempt $i"
              exit 0
            fi
            echo "push rejected, retry $i"
            sleep $((i * 3))
          done
          echo "push failed after retries" >&2
          exit 1
